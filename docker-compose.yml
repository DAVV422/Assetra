services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assetra-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - CORS_ORIGIN=http://localhost:5173,http://127.0.0.1:5173
      - ASSETRA_MODE=live
      - STELLAR_NETWORK=testnet
      - STELLAR_RPC_URL=https://soroban-testnet.stellar.org
      - STELLAR_NETWORK_PASSPHRASE=Test SDF Network ; September 2015
      - RWA_REGISTRY_CONTRACT_ID=CAC57CATCF5DZYLRW6XEZ4DP367V25D24KO6V37U4EEQWJO3CTVV7N5F
      - PERMISSIONED_TOKEN_CONTRACT_ID=CBACUWCFDNO7BU7UCI7G4U45Y5WDNXCAGVI4AFQO5ZBMBHMRFC67GLKG
    volumes:
      # Persistencia de activos creados y borradores en disco
      - ./backend/data:/app/data
      # (Opcional en entornos Linux/WSL) Montar claves locales de Stellar CLI del host:
      # - ~/.config/stellar:/root/.config/stellar:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
