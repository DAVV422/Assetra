services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assetra-backend
    restart: unless-stopped
    ports:
      # Solo en localhost: la API no tiene autenticación, no la expongas a la red
      - "127.0.0.1:4000:4000"
    # Los IDs de contrato se leen de contracts.json (copiado en la imagen).
    # El backend no necesita claves: los usuarios firman con su wallet (Freighter).
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=4000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
      - ASSETRA_MODE=${ASSETRA_MODE:-live}
      - STELLAR_NETWORK=testnet
      - STELLAR_RPC_URL=https://soroban-testnet.stellar.org
      - STELLAR_NETWORK_PASSPHRASE=Test SDF Network ; September 2015
    volumes:
      # Persistencia de activos creados y borradores en disco
      - ./backend/data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
